name: Taiwan ABC v4 B-to-C volume redK

on:
  workflow_dispatch:
  schedule:
    # 11:40 UTC = Taiwan 19:40 (Mon-Fri)
    - cron: '40 11 * * 1-5'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Main v3 B-C screener
        run: python -u b_wave_breakout.py --asof auto --min-universe 200 --watch-size 200 --workers 12 --out results
      - name: B-C breakout morphological study
        run: python -u b2c_volume_redk_study.py --asof auto --min-universe 200 --workers 12 --out results
      - name: Show result summary
        if: always()
        shell: bash
        run: |
          if [ -s results/GITHUB_SUMMARY.md ]; then
            cat results/GITHUB_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s results/B2C_GITHUB_SUMMARY.md ]; then
            cat results/B2C_GITHUB_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ ! -s results/GITHUB_SUMMARY.md ] && [ ! -s results/B2C_GITHUB_SUMMARY.md ]; then
            echo 'No output: open failed job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload CSV reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-abc-v4-results-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
